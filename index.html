<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f7f8f3"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>原稿用紙</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:#25382e;font-family:'BIZ UDPGothic','Hiragino Sans',sans-serif}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:26px}button,select{font:inherit;padding:10px;border:1px solid #9ba99e;border-radius:8px;background:white;color:inherit}textarea{width:100%;min-height:150px;font:inherit;font-size:20px;line-height:1.7;padding:12px;border:1px solid #9ba99e;border-radius:8px} .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.sheet{display:grid;border-top:1px solid #829b87;border-left:1px solid #829b87;width:100%;max-width:var(--w);margin:auto;background:white}.cell{aspect-ratio:1;border-right:1px solid #829b87;border-bottom:1px solid #829b87;display:flex;align-items:center;justify-content:center;font-size:var(--fs);line-height:1;min-width:0}.active{background:#d9edf9;box-shadow:inset 0 0 0 2px #5285a7}.page{margin:20px auto;text-align:center}.vertical .cell{writing-mode:vertical-rl}.small{font-size:.65em}#printpages{display:none}#status{font-size:13px} @media print{@page{size:A4;margin:12mm}body{background:white}main{padding:0;max-width:none}main>*{display:none!important}#printpages{display:block!important}.page{break-after:page;margin:0}.page:last-child{break-after:auto}.sheet{max-width:var(--pw);--fs:5mm}.active{background:white;box-shadow:none}}
</style><main><h1>原稿用紙</h1><div class="tools"><select id="dir" aria-label="書く方向"><option value="v">縦書き</option><option value="h">横書き</option></select><select id="size" aria-label="字数"><option>200</option><option>400</option></select>字詰め <label><input id="indent" type="checkbox" checked> 自動字下げ</label><label>文字サイズ <select id="zoom"><option value="24">標準</option><option value="32">大きめ</option><option value="18">小さめ</option></select></label></div><label for="draft">ここに文章を入力</label><textarea id="draft" placeholder="文章を書いてみよう。" spellcheck="false"></textarea><div class="tools"><span id="count"></span><span id="status" role="status"></span></div><div id="preview"></div><div class="tools"><button id="prev">前のページ</button><span id="num"></span><button id="next">次のページ</button></div><div class="tools"><button id="save">文章を保存（TXT）</button><button id="load">文章を開く</button><input type="file" id="file" accept=".txt,text/plain" hidden><button id="print">印刷・PDF</button><button id="clear">新しい作文</button></div><p>作文はこの端末のブラウザに保存します。大切な作文はTXTでも保存してください。</p><div id="printpages"></div></main><script>
const $=id=>document.getElementById(id),key='genkou-v1';let page=0;try{const d=JSON.parse(localStorage.getItem(key)||'null');if(d){$('draft').value=d.text;$('dir').value=d.dir;$('size').value=d.size;$('indent').checked=d.indent;$('zoom').value=d.zoom||24}}catch(e){}function persist(){try{localStorage.setItem(key,JSON.stringify({text:$('draft').value,dir:$('dir').value,size:$('size').value,indent:$('indent').checked,zoom:$('zoom').value}));$('status').textContent='端末内に保存済み'}catch(e){$('status').textContent='自動保存できません。TXTで保存してください'}}
function layout(){let a=[],p=0,n=+$('size').value,lines=n/20;const s=$('draft').value;let caret=$('draft').selectionEnd,offset=0,cursor=null;const paras=s.split('\n');paras.forEach((para,i)=>{if(i){if(p%20)p+=20-p%20;else if(!paras[i-1])p+=20}if($('indent').checked&&para&&!/^[ 　]/.test(para))a[p++]='　';for(const ch of Array.from(para)){if(cursor===null&&offset>=caret)cursor=p;if(p%20===0&&p>0&&/[、。）」』】！？]/.test(ch)&&a[p-1])a[p-1]+=ch;else a[p++]=ch;offset+=ch.length}if(cursor===null&&offset>=caret)cursor=p;offset++});return {a,p,n,lines,cursor:cursor??p,total:Math.max(1,Math.ceil(p/n),Math.floor((cursor??p)/n)+1)}}
function sheet(d,pg,active){const v=$('dir').value==='v',cols=v?d.lines:20,rows=v?20:d.lines,z=+$('zoom').value;let wrap=document.createElement('div');wrap.className='page';let grid=document.createElement('div');grid.className='sheet'+(v?' vertical':'');grid.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;grid.style.setProperty('--w',cols*(z+10)+'px');grid.style.setProperty('--pw',Math.min(cols*8.5,180,rows?245*cols/rows:180)+'mm');grid.style.setProperty('--fs',`clamp(9px,${v?3.8:2.6}vw,${z}px)`);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let i=pg*d.n+(v?(cols-1-c)*20+r:r*20+c),el=document.createElement('div');el.className='cell'+(active&&i===d.cursor?' active':'');let t=document.createElement('span');t.textContent=d.a[i]||'';if(t.textContent.length>1)t.className='small';el.append(t);grid.append(el)}wrap.append(grid);return wrap}
function render(follow=false){let d=layout();if(follow)page=Math.floor(d.cursor/d.n);page=Math.max(0,Math.min(page,d.total-1));$('preview').replaceChildren(sheet(d,page,true));$('num').textContent=`${page+1} / ${d.total} 枚`;$('count').textContent=Array.from($('draft').value.replace(/\n/g,'')).length+'文字';$('prev').disabled=!page;$('next').disabled=page>=d.total-1}
$('draft').addEventListener('input',()=>{persist();render(true)});for(const ev of ['click','keyup','select'])$('draft').addEventListener(ev,()=>render(true));for(const id of ['dir','size','indent','zoom'])$(id).onchange=()=>{persist();render(true)};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('save').onclick=()=>{let u=URL.createObjectURL(new Blob([$('draft').value],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='作文.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};$('load').onclick=()=>{if(!$('draft').value||confirm('今の作文を置き換えます。保存しましたか？'))$('file').click()};$('file').onchange=async()=>{let f=$('file').files[0];if(f){$('draft').value=await f.text();persist();render(true)}$('file').value=''};$('clear').onclick=()=>{if(confirm('今の作文を消して新しく書きますか？')){$('draft').value='';persist();render(true)}};$('print').onclick=()=>{let d=layout();$('printpages').replaceChildren(...Array.from({length:Math.max(1,Math.ceil(d.p/d.n))},(_,i)=>sheet(d,i,false)));window.print()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
